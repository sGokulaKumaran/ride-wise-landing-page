<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RIDEWISE</title>

  <!-- App Tab Icon -->
  <link rel="icon" type="image/png" href="ridewise-icon-192.png" />

  <!-- Google Fonts: body text + wordmark -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="landingPage.css" />
</head>
<body>

  <!-- Top Bar -->
  <header class="topbar" id="topbar">

    <!-- Left: Try RideWise Button -->
    <div class="topbar-left">
      <a href="https://ride-wise.pages.dev" target="_blank" rel="noopener noreferrer" class="btn-try" id="btnTryRideWise" aria-label="Try RideWise (opens the app)">
        <span class="btn-text">Try RideWise</span>
        <!-- Tyre wrapper with speed lines behind it -->
        <span class="tyre-wrapper">
          <span class="speed-lines" aria-hidden="true">
            <span class="speed-line line-1"></span>
            <span class="speed-line line-2"></span>
          </span>
          <!-- Wheel / Tyre SVG -->
          <svg class="btn-tyre" id="btnTyreIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <!-- Outer tyre rim -->
            <circle cx="12" cy="12" r="10"></circle>
            <!-- Center hub -->
            <circle cx="12" cy="12" r="3.5" fill="currentColor"></circle>
            <!-- Wheel spokes -->
            <line x1="12" y1="2" x2="12" y2="8.5"></line>
            <line x1="12" y1="15.5" x2="12" y2="22"></line>
            <line x1="2" y1="12" x2="8.5" y2="12"></line>
            <line x1="15.5" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="4.93" x2="9.5" y2="9.5"></line>
            <line x1="14.5" y1="14.5" x2="19.07" y2="19.07"></line>
            <line x1="4.93" y1="19.07" x2="9.5" y2="14.5"></line>
            <line x1="14.5" y1="9.5" x2="19.07" y2="4.93"></line>
          </svg>
        </span>
      </a>
    </div>

    <!-- Center: App Logo + Name -->
    <div class="topbar-center">
      <a href="#" class="brand" aria-label="RideWise home">
        <img src="ridewise-icon-192.png" alt="" class="brand-logo" />
        <span class="app-name">RIDEWISE</span>
      </a>
    </div>

    <!-- Right: 3-Segmented Pill Switcher (System, Light, Dark) -->
    <div class="topbar-right">
      <div class="theme-segment" id="themeSegment" role="radiogroup" aria-label="Theme switcher">
        <!-- Sliding highlight behind the active button -->
        <span class="theme-thumb" aria-hidden="true"></span>

        <!-- 1. System -->
        <button class="theme-btn" role="radio" data-theme-choice="system" title="System preference" aria-label="System preference">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </button>

        <!-- 2. Light -->
        <button class="theme-btn" role="radio" data-theme-choice="light" title="Light theme" aria-label="Light theme">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>

        <!-- 3. Dark -->
        <button class="theme-btn" role="radio" data-theme-choice="dark" title="Dark theme" aria-label="Dark theme">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <!-- Next sections will go here -->
  </main>

  <!-- ==========================================================================
       ZIPPER LAUNCH TRANSITION OVERLAY
       ========================================================================== -->
  <div id="zipOverlay" class="zip-overlay" aria-hidden="true">
    <!-- Unzipped Portal Screen (revealed from top-left downward) -->
    <div class="zip-portal" id="zipPortal">
      <div class="zip-portal-content">
        <div class="zip-portal-brand">
          <img src="ridewise-icon-192.png" alt="RideWise" class="zip-portal-logo" />
          <span class="zip-portal-name">RIDEWISE</span>
        </div>
        <p class="zip-portal-tagline">Launching Navigation Platform...</p>
        <div class="zip-portal-track">
          <div class="zip-portal-progress"></div>
        </div>
      </div>
    </div>

    <!-- Zipper teeth + fabric edge shadows (drawn by JS every frame) -->
    <svg class="zip-svg" id="zipSvg">
      <defs>
        <filter id="zipBlur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="6"></feGaussianBlur>
        </filter>
      </defs>
      <!-- Shadows cast by the two fabric edges into the opening -->
      <polyline id="zipShadowTop" class="zip-shadow"></polyline>
      <polyline id="zipShadowBottom" class="zip-shadow"></polyline>
      <!-- Fabric tape lines -->
      <polyline id="zipTapeTop" class="zip-tape"></polyline>
      <polyline id="zipTapeBottom" class="zip-tape"></polyline>
      <!-- Separated teeth on each open edge -->
      <polyline id="zipTeethTop" class="zip-teeth"></polyline>
      <polyline id="zipTeethBottom" class="zip-teeth"></polyline>
      <!-- Still-closed (interlocked) teeth: before the stop and ahead of the slider -->
      <path id="zipClosedA" class="zip-teeth"></path>
      <path id="zipClosedB" class="zip-teeth offset"></path>
    </svg>

    <!-- The slider: the tyre itself -->
    <div class="zip-slider" id="zipSlider">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="12" r="3.5" fill="currentColor"></circle>
        <line x1="12" y1="2" x2="12" y2="8.5"></line>
        <line x1="12" y1="15.5" x2="12" y2="22"></line>
        <line x1="2" y1="12" x2="8.5" y2="12"></line>
        <line x1="15.5" y1="12" x2="22" y2="12"></line>
        <line x1="4.93" y1="4.93" x2="9.5" y2="9.5"></line>
        <line x1="14.5" y1="14.5" x2="19.07" y2="19.07"></line>
        <line x1="4.93" y1="19.07" x2="9.5" y2="14.5"></line>
        <line x1="14.5" y1="9.5" x2="19.07" y2="4.93"></line>
      </svg>
    </div>
  </div>
  <script src="landingPage.js"></script>
</body>
</html>
